services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-abastobot}
      POSTGRES_USER: ${POSTGRES_USER:-abastobot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    environment: &app_env
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-abastobot}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-abastobot}
    command: ["node", "dist/migrate.js"]
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build: .
    restart: unless-stopped
    environment: *app_env
    env_file: .env
    volumes:
      - media_data:/app/storage/media
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose: ["4002"]
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:4002/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    build: .
    restart: unless-stopped
    command: ["node", "dist/worker/index.js"]
    environment: *app_env
    env_file: .env
    volumes:
      - media_data:/app/storage/media
    depends_on:
      migrate:
        condition: service_completed_successfully

  legacy-import:
    build: .
    profiles: ["tools"]
    command: ["node", "dist/importLegacy.js"]
    environment: *app_env
    volumes:
      - ./data:/app/data:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

  backup:
    build:
      context: .
      dockerfile: deploy/backup.Dockerfile
    profiles: ["backup"]
    restart: unless-stopped
    environment: *app_env
    env_file: .env
    volumes:
      - media_data:/app/storage/media:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: ["production"]
    env_file: .env
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  media_data:
